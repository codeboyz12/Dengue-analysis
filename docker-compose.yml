# ใช้งาน:  docker compose run --rm pipeline <คำสั่งของ dengue_pipeline>
#   docker compose run --rm pipeline run --trends-input input/TRENDS.xlsx --weather-input input/weather_daily.csv
#   docker compose run --rm pipeline status
#   docker compose run --rm pipeline export
#   docker compose --profile tests run --rm tests          # รันเทสทั้งชุดในภาพ
# ข้อมูลทั้งหมดอยู่บนเครื่องคุณ (โฟลเดอร์ data/ input/ reports/ config/) ลบ container แล้วข้อมูลไม่หาย
x-pipeline: &pipeline
  build:
    context: .
  image: dengue-pipeline:latest
  # Linux: ให้ไฟล์ที่เขียนลง data/ เป็นของผู้ใช้ปัจจุบัน (export UID GID ก่อน) macOS/Docker Desktop ไม่ต้องสนใจ
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ./config:/app/config:ro
    - ./data:/app/data
    - ./input:/app/input
    - ./reports:/app/reports

services:
  pipeline:
    <<: *pipeline
    build:
      context: .
      target: base

  tests:
    <<: *pipeline
    image: dengue-pipeline-dev:latest
    build:
      context: .
      target: dev
    pull_policy: build
    profiles: ["tests"]
    volumes: []          # เทสใช้ข้อมูลสังเคราะห์ใน tmp ไม่แตะ data/ จริง

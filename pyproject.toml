[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dengue-pipeline"
version = "0.1.0"
description = "Data pipeline: TRENDS (dengue/chikungunya/HFMD) + ERA5 weather, with validation gates"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy",
    "openpyxl",
    "requests",
    "pyarrow",
    "duckdb==2.0.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "tqdm>=4.64",
    "scipy>=1.10",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]
dashboard = ["streamlit>=1.30"]
ml = ["torch>=2.0"]

[project.scripts]
dengue-pipeline = "dengue_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
